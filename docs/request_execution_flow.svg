<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1380" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e8449"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d68910"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="960" height="1380" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Request Execution Flow — POST /invoke</text>

  <!-- ===== Step 1: Incoming Request ===== -->
  <rect x="340" y="56" width="280" height="50" rx="8" fill="#4a90d9" filter="url(#shadow)"/>
  <text x="480" y="76" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">POST /invoke</text>
  <text x="480" y="94" text-anchor="middle" fill="#dce6f0" font-size="11">Authorization: Bearer &lt;token&gt;</text>

  <line x1="480" y1="106" x2="480" y2="126" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Extract Token -->
  <rect x="360" y="128" width="240" height="40" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="144" text-anchor="middle" fill="#2c3e50" font-weight="600">1. Extract Bearer Token</text>
  <text x="480" y="160" text-anchor="middle" fill="#7f8c8d" font-size="11">Parse Authorization header</text>

  <line x1="480" y1="168" x2="480" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Token valid? -->
  <polygon points="480,190 560,215 480,240 400,215" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="219" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Valid?</text>

  <!-- No → 401 -->
  <line x1="560" y1="215" x2="700" y2="215" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="620" y="208" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">No</text>
  <rect x="702" y="200" width="140" height="30" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="772" y="220" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">401 Unauthorized</text>

  <!-- Yes ↓ -->
  <line x1="480" y1="240" x2="480" y2="260" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="254" fill="#27ae60" font-size="11" font-weight="bold">Yes</text>

  <!-- Step 3: Identity Resolution -->
  <rect x="340" y="262" width="280" height="50" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="282" text-anchor="middle" fill="#2c3e50" font-weight="600">2. Identity Resolution</text>
  <text x="480" y="300" text-anchor="middle" fill="#7f8c8d" font-size="11">Token → Principal (tenant, user, scopes)</text>

  <line x1="480" y1="312" x2="480" y2="332" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Principal found? -->
  <polygon points="480,334 570,359 480,384 390,359" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="363" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Found?</text>

  <line x1="570" y1="359" x2="700" y2="359" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="630" y="352" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">No</text>
  <rect x="702" y="344" width="140" height="30" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="772" y="364" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">401 Unauthorized</text>

  <line x1="480" y1="384" x2="480" y2="404" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="398" fill="#27ae60" font-size="11" font-weight="bold">Yes</text>

  <!-- Step 4: Registry Lookup -->
  <rect x="340" y="406" width="280" height="50" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="426" text-anchor="middle" fill="#2c3e50" font-weight="600">3. Registry Lookup</text>
  <text x="480" y="444" text-anchor="middle" fill="#7f8c8d" font-size="11">capability → agent + required_scope + tool</text>

  <line x1="480" y1="456" x2="480" y2="476" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Capability registered? -->
  <polygon points="480,478 580,503 480,528 380,503" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="507" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Registered?</text>

  <line x1="580" y1="503" x2="700" y2="503" stroke="#d68910" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="630" y="496" text-anchor="middle" fill="#d68910" font-size="11" font-weight="bold">No</text>
  <rect x="702" y="488" width="140" height="30" rx="6" fill="#e67e22" filter="url(#shadow)"/>
  <text x="772" y="508" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">404 Not Found</text>

  <line x1="480" y1="528" x2="480" y2="548" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="542" fill="#27ae60" font-size="11" font-weight="bold">Yes</text>

  <!-- Step 5: Scope Check -->
  <rect x="340" y="550" width="280" height="50" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="570" text-anchor="middle" fill="#2c3e50" font-weight="600">4. Scope Check</text>
  <text x="480" y="588" text-anchor="middle" fill="#7f8c8d" font-size="11">principal.scopes ⊇ required_scope?</text>

  <line x1="480" y1="600" x2="480" y2="620" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Authorized? -->
  <polygon points="480,622 575,647 480,672 385,647" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="651" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Authorized?</text>

  <line x1="575" y1="647" x2="700" y2="647" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="630" y="640" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">No</text>
  <rect x="702" y="630" width="160" height="34" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="782" y="647" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">403 Forbidden</text>
  <text x="782" y="660" text-anchor="middle" fill="#fddede" font-size="10">(adapter NOT called)</text>

  <line x1="480" y1="672" x2="480" y2="692" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="686" fill="#27ae60" font-size="11" font-weight="bold">Yes</text>

  <!-- Step 6: Execution Engine (big box) -->
  <rect x="200" y="694" width="560" height="320" rx="10" fill="#f5f0fa" stroke="#8e44ad" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="480" y="716" text-anchor="middle" fill="#6c3483" font-weight="bold" font-size="15">5. Execution Engine</text>

  <!-- Attempt box -->
  <rect x="340" y="726" width="280" height="40" rx="6" fill="#8e44ad" filter="url(#shadow)"/>
  <text x="480" y="746" text-anchor="middle" fill="#fff" font-weight="600">Mock Tool Adapter — invoke()</text>
  <text x="480" y="760" text-anchor="middle" fill="#d5b8e8" font-size="10">with simulation mode &amp; 250ms timeout</text>

  <line x1="480" y1="766" x2="480" y2="786" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Outcome decision -->
  <polygon points="480,788 580,818 480,848 380,818" fill="#fff" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="822" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Outcome?</text>

  <!-- Success path -->
  <line x1="380" y1="818" x2="260" y2="818" stroke="#1e8449" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="320" y="810" text-anchor="middle" fill="#1e8449" font-size="11" font-weight="bold">OK</text>
  <rect x="218" y="842" width="84" height="24" rx="6" fill="#27ae60"/>
  <text x="260" y="858" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">completed</text>

  <!-- Connect success down -->
  <line x1="260" y1="866" x2="260" y2="920" stroke="#1e8449" stroke-width="1.5"/>

  <!-- Transient path (retry) -->
  <line x1="480" y1="848" x2="480" y2="870" stroke="#d68910" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="498" y="863" fill="#d68910" font-size="11" font-weight="bold">Transient</text>

  <rect x="410" y="872" width="140" height="36" rx="6" fill="#f39c12" filter="url(#shadow)"/>
  <text x="480" y="888" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">sleep(backoff)</text>
  <text x="480" y="902" text-anchor="middle" fill="#fff" font-size="10">50ms → 100ms</text>

  <!-- Retry arrow back up -->
  <line x1="550" y1="890" x2="620" y2="890" stroke="#d68910" stroke-width="1.5"/>
  <line x1="620" y1="890" x2="620" y2="746" stroke="#d68910" stroke-width="1.5"/>
  <line x1="620" y1="746" x2="582" y2="746" stroke="#d68910" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <text x="636" y="820" fill="#d68910" font-size="10" font-weight="bold">retry</text>
  <text x="636" y="832" fill="#d68910" font-size="10">(max 3)</text>

  <!-- Terminal failures -->
  <line x1="580" y1="818" x2="700" y2="818" stroke="#c0392b" stroke-width="1.5"/>
  <text x="640" y="810" text-anchor="middle" fill="#c0392b" font-size="10" font-weight="bold">Terminal</text>

  <rect x="702" y="780" width="48" height="18" rx="4" fill="#e74c3c"/>
  <text x="726" y="793" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">502</text>
  <text x="726" y="774" text-anchor="middle" fill="#7f8c8d" font-size="9">Permanent</text>

  <rect x="702" y="806" width="48" height="18" rx="4" fill="#e74c3c"/>
  <text x="726" y="819" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">502</text>
  <text x="726" y="832" text-anchor="middle" fill="#7f8c8d" font-size="9">Malformed</text>

  <rect x="702" y="844" width="48" height="18" rx="4" fill="#e74c3c"/>
  <text x="726" y="857" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">504</text>
  <text x="726" y="870" text-anchor="middle" fill="#7f8c8d" font-size="9">Timeout</text>

  <rect x="702" y="882" width="48" height="18" rx="4" fill="#e74c3c"/>
  <text x="726" y="895" text-anchor="middle" fill="#fff" font-size="9" font-weight="bold">503</text>
  <text x="726" y="908" text-anchor="middle" fill="#7f8c8d" font-size="9">Exhausted</text>

  <!-- Connect terminal failures down -->
  <line x1="726" y1="908" x2="726" y2="920" stroke="#c0392b" stroke-width="1.5"/>

  <!-- ===== Below engine box ===== -->

  <!-- Step 7: Build Result -->
  <rect x="300" y="1030" width="360" height="46" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="1050" text-anchor="middle" fill="#2c3e50" font-weight="600">6. Build ExecutionResult</text>
  <text x="480" y="1066" text-anchor="middle" fill="#7f8c8d" font-size="11">status, result/error, attempts, duration_ms, events[]</text>

  <!-- Connecting lines from engine to result -->
  <line x1="260" y1="920" x2="260" y2="1053" stroke="#555" stroke-width="1.5"/>
  <line x1="260" y1="1053" x2="298" y2="1053" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="726" y1="920" x2="726" y2="1053" stroke="#555" stroke-width="1.5"/>
  <line x1="726" y1="1053" x2="662" y2="1053" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="1076" x2="480" y2="1100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 8: Store Trace -->
  <rect x="300" y="1102" width="360" height="46" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="480" y="1122" text-anchor="middle" fill="#2c3e50" font-weight="600">7. Store Trace</text>
  <text x="480" y="1138" text-anchor="middle" fill="#7f8c8d" font-size="11">request_id, tenant_id, user_id, events — no secrets</text>

  <line x1="480" y1="1148" x2="480" y2="1172" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 9: Return Response -->
  <rect x="300" y="1174" width="360" height="40" rx="6" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="480" y="1199" text-anchor="middle" fill="#fff" font-weight="bold" font-size="14">8. Return HTTP Response</text>

  <line x1="480" y1="1214" x2="480" y2="1234" stroke="#555" stroke-width="1.5"/>

  <!-- Response codes -->
  <line x1="480" y1="1234" x2="240" y2="1234" stroke="#555" stroke-width="1"/>
  <line x1="480" y1="1234" x2="720" y2="1234" stroke="#555" stroke-width="1"/>
  <line x1="240" y1="1234" x2="240" y2="1250" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="400" y1="1234" x2="400" y2="1250" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="560" y1="1234" x2="560" y2="1250" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="720" y1="1234" x2="720" y2="1250" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="188" y="1252" width="104" height="40" rx="6" fill="#27ae60" filter="url(#shadow)"/>
  <text x="240" y="1269" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">200</text>
  <text x="240" y="1284" text-anchor="middle" fill="#d5f5e3" font-size="10">completed</text>

  <rect x="348" y="1252" width="104" height="40" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="400" y="1269" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">502</text>
  <text x="400" y="1284" text-anchor="middle" fill="#fddede" font-size="10">PERMANENT / INVALID</text>

  <rect x="508" y="1252" width="104" height="40" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="560" y="1269" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">503</text>
  <text x="560" y="1284" text-anchor="middle" fill="#fddede" font-size="10">UNAVAILABLE</text>

  <rect x="668" y="1252" width="104" height="40" rx="6" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="720" y="1269" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">504</text>
  <text x="720" y="1284" text-anchor="middle" fill="#fddede" font-size="10">TIMEOUT</text>

  <!-- Legend -->
  <rect x="40" y="1320" width="880" height="44" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <circle cx="80" cy="1342" r="8" fill="#27ae60"/>
  <text x="94" y="1346" fill="#555" font-size="11">Success</text>
  <circle cx="170" cy="1342" r="8" fill="#e74c3c"/>
  <text x="184" y="1346" fill="#555" font-size="11">Auth/Execution Failure</text>
  <circle cx="326" cy="1342" r="8" fill="#e67e22"/>
  <text x="340" y="1346" fill="#555" font-size="11">Not Found</text>
  <circle cx="430" cy="1342" r="8" fill="#f39c12"/>
  <text x="444" y="1346" fill="#555" font-size="11">Retry Backoff</text>
  <circle cx="546" cy="1342" r="8" fill="#8e44ad"/>
  <text x="560" y="1346" fill="#555" font-size="11">Execution Engine</text>
  <circle cx="676" cy="1342" r="8" fill="#4a90d9"/>
  <text x="690" y="1346" fill="#555" font-size="11">Pipeline Step</text>
</svg>
