<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e8449"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfc"/>
      <stop offset="100%" stop-color="#f0f2f5"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="700" height="420" fill="url(#bg2)" rx="8"/>

  <text x="350" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Trace Retrieval Flow — GET /traces/{request_id}</text>

  <!-- Request -->
  <rect x="230" y="52" width="240" height="44" rx="8" fill="#4a90d9" filter="url(#sh)"/>
  <text x="350" y="72" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">GET /traces/{request_id}</text>
  <text x="350" y="88" text-anchor="middle" fill="#dce6f0" font-size="11">Authorization: Bearer &lt;token&gt;</text>

  <line x1="350" y1="96" x2="350" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Auth check -->
  <polygon points="350,122 440,152 350,182 260,152" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="150" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Token valid?</text>
  <text x="350" y="164" text-anchor="middle" fill="#7f8c8d" font-size="10">Resolve principal</text>

  <!-- No → 401 -->
  <line x1="440" y1="152" x2="560" y2="152" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="495" y="145" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">No</text>
  <rect x="562" y="137" width="120" height="30" rx="6" fill="#e74c3c" filter="url(#sh)"/>
  <text x="622" y="157" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">401 Unauthorized</text>

  <!-- Yes ↓ -->
  <line x1="350" y1="182" x2="350" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="362" y="200" fill="#27ae60" font-size="11" font-weight="bold">Yes</text>

  <!-- Ownership check -->
  <polygon points="350,212 460,252 350,292 240,252" fill="#fff" stroke="#4a90d9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="350" y="244" text-anchor="middle" fill="#2c3e50" font-size="12" font-weight="600">Trace exists</text>
  <text x="350" y="258" text-anchor="middle" fill="#2c3e50" font-size="11">AND same user</text>
  <text x="350" y="272" text-anchor="middle" fill="#2c3e50" font-size="11">AND same tenant?</text>

  <!-- No → 404 -->
  <line x1="460" y1="252" x2="560" y2="252" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="505" y="245" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">No</text>
  <rect x="562" y="235" width="120" height="34" rx="6" fill="#e67e22" filter="url(#sh)"/>
  <text x="622" y="253" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">404 Not Found</text>
  <text x="622" y="265" text-anchor="middle" fill="#fde8d0" font-size="9">(opaque — no info leak)</text>

  <!-- Yes ↓ -->
  <line x1="350" y1="292" x2="350" y2="320" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="362" y="310" fill="#27ae60" font-size="11" font-weight="bold">Yes</text>

  <!-- Return trace -->
  <rect x="240" y="322" width="220" height="50" rx="8" fill="#27ae60" filter="url(#sh)"/>
  <text x="350" y="343" text-anchor="middle" fill="#fff" font-weight="bold" font-size="13">200 + Trace</text>
  <text x="350" y="362" text-anchor="middle" fill="#d5f5e3" font-size="11">events, attempts, duration_ms, status</text>

  <!-- Legend -->
  <rect x="100" y="390" width="500" height="24" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="350" y="406" text-anchor="middle" fill="#7f8c8d" font-size="11">Only the same principal (user + tenant) that created the invocation can read its trace</text>
</svg>
